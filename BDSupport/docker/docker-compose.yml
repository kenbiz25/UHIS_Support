version: "3.9"

services:
  api:
    build: ../
    env_file:
      - ../.env
    environment:
      - KB_DIR=/app/kb
      - FAISS_INDEX_DIR=/app/core/faiss_index
    volumes:
      - ../kb:/app/kb
      - ../core/faiss_index:/app/core/faiss_index
    ports:
      # Host 8002, not 8000 - avoids colliding with the existing ComEMR
      # container on this same server. Bound to localhost only; only the
      # wa_router dispatcher (also on this box) needs to reach it.
      - "127.0.0.1:8002:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: dbname
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: postgres:16
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: user
      PGPASSWORD: pass
      PGDATABASE: dbname
    volumes:
      - ../migrations:/migrations
    command: ["bash", "-lc", "psql -f /migrations/001_init_pgvector.sql"]

volumes:
  pgdata:
